version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: certificate_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certificatedb}
      POSTGRES_USER: ${POSTGRES_USER:-certuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cert_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-certuser} -d ${POSTGRES_DB:-certificatedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cert_postgres_data:
