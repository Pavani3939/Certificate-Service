server:
  port: ${PORT:8080}

spring:
  application:
    name: certificate-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certificatedb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:certuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:certpass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/postgresql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  seed-data:
    enabled: ${SEED_DATA_ENABLED:true}
